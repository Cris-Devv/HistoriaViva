<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 360° — História Viva</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/streetview.css">
</head>
<body>
    <header class="site-header">
        <div>
            <p class="eyebrow">Experiência histórica imersiva</p>
            <h1>História Viva</h1>
            <p>Explore o Recife através do tempo.</p>
        </div>
        <button id="locations-toggle" class="button button-outline" type="button"
            aria-controls="locations-panel" aria-expanded="false">
            <span aria-hidden="true">☰</span> Locais
        </button>
    </header>

    <main>
        <aside id="locations-panel" class="locations-panel" aria-hidden="true">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">Explore</p>
                    <h2>Escolha um local</h2>
                </div>
                <button id="locations-close" class="icon-button" type="button" aria-label="Fechar menu">×</button>
            </div>
            <nav id="locations-list" aria-label="Localidades disponíveis"></nav>
        </aside>

        <section id="streetview-container" aria-label="Visualização panorâmica">
            <a-scene embedded>
                <a-sky id="panorama-sky" rotation="0 -90 0"></a-sky>
                <a-entity position="0 1.6 0">
                    <a-camera
                        look-controls="reverseMouseDrag: false"
                        wasd-controls="enabled: false"
                        cursor="rayOrigin: mouse; fuse: false"
                        raycaster="objects: .hotspot, .info-hotspot, .info-hotspot-hit; far: 100">
                    </a-camera>
                </a-entity>
                <a-entity id="navigation-points"></a-entity>
                <a-entity id="information-points"></a-entity>
            </a-scene>
            <nav id="information-list" class="information-list" aria-label="Pontos informativos" hidden></nav>
            <dialog id="info-popup" class="info-popup" aria-modal="true"
                aria-labelledby="info-popup-title"
                aria-describedby="info-popup-description"
                aria-hidden="true" hidden>
                <div class="info-popup-card">
                    <div class="info-popup-heading">
                        <span class="info-popup-icon" aria-hidden="true">i</span>
                        <button id="info-popup-close" class="icon-button" type="button"
                            aria-label="Fechar informações">×</button>
                    </div>
                    <h2 id="info-popup-title"></h2>
                    <p id="info-popup-description"></p>
                    <div id="info-popup-audio" class="info-popup-audio" hidden>
                        <button id="info-popup-audio-toggle" class="button button-audio" type="button"
                            aria-label="Reproduzir narração">
                            <span aria-hidden="true">▶</span>
                            <span id="info-popup-audio-label">Ouvir narração</span>
                        </button>
                        <button id="info-popup-audio-stop" class="button button-audio-stop" type="button">
                            Parar
                        </button>
                        <p id="info-popup-audio-status" class="info-popup-audio-status" role="status"></p>
                    </div>
                </div>
            </dialog>
        </section>

        <section class="experience-bar" aria-live="polite">
            <div class="location-summary">
                <p class="eyebrow">Você está em</p>
                <h2 id="location-name">Carregando local...</h2>
                <p id="location-period"></p>
                <p id="location-description"></p>
                <p id="panorama-status" role="status"></p>
            </div>
            <div class="navigation-controls" aria-label="Controles de navegação">
                <button id="navigation-back" class="control-button" type="button" aria-label="Voltar para o local anterior">
                    <span aria-hidden="true">←</span> <span class="control-label">Voltar</span>
                </button>
                <button id="navigation-first" class="control-button" type="button" aria-label="Retornar ao primeiro local">
                    <span aria-hidden="true">⌂</span> <span class="control-label">Início</span>
                </button>
                <button id="navigation-forward" class="control-button" type="button" aria-label="Avançar para o próximo local">
                    <span class="control-label">Avançar</span> <span aria-hidden="true">→</span>
                </button>
            </div>
        </section>
        <p class="instructions">Arraste para olhar ao redor. Toque nos pontos dourados para visitar outro local ou nos ícones de informação para saber mais.</p>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
