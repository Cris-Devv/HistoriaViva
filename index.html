<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recife pelo Tempo</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/streetview.css">
</head>

<body>

    <header>
        <h1>Recife pelo Tempo</h1>
        <p>Explore a cidade através do tempo.</p>
    </header>

    <main>
        <section id="streetview-container">

            <a-scene embedded>
                <a-assets>
                    <img
                        id="panorama"
                        src="assets/images/panoramas/teste-01.jpg"
                    >
                </a-assets>

                <!-- Ambiente 360° -->
                <a-sky
                    id="panorama-sky"
                    src="#panorama"
                    rotation="0 -90 0"
                ></a-sky>

                <!-- Câmera do usuário -->
                <a-entity position="0 1.6 0">
                    <a-camera
                        look-controls="reverseMouseDrag: false"
                        wasd-controls="enabled: false"
                        cursor="rayOrigin: mouse; fuse: false"
                        raycaster="objects: .hotspot"
                    ></a-camera>
                </a-entity>

                <!-- Os pontos de navegação serão adicionados pelo JS -->
                <a-entity id="navigation-points"></a-entity>

            </a-scene>

        </section>
    </main>

    <script type="module" src="js/main.js"></script>

</body>
</html>
